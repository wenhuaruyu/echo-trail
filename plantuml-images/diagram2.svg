  <path class="line" d="M600 510V560"/><rect class="s" x="430" y="560" width="340" height="80" fill="#d7b8f3"/><text class="t" x="600" y="593" text-anchor="middle" font-size="20" font-weight="700">完整点亮</text><text class="t" x="600" y="620" text-anchor="middle" font-size="16">集齐三类票根</text>
