<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680">
  <rect width="1200" height="680" fill="#f7f4ee"/>
  <style>.t{font-family:Arial,'PingFang SC';fill:#222}.s{stroke:#333;stroke-width:2;rx:24}.line{stroke:#444;stroke-width:2;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#444"/></marker></defs>
  <text class="t" x="600" y="48" text-anchor="middle" font-size="28" font-weight="700">省份点亮状态机</text>
  <circle cx="600" cy="92" r="18" fill="#333"/><path class="line" d="M600 110V150"/>
  <rect class="s" x="500" y="150" width="200" height="64" fill="#ddd"/><text class="t" x="600" y="189" text-anchor="middle" font-size="20">未点亮</text>
  <path class="line" d="M500 182H230V270"/><path class="line" d="M600 214V270"/><path class="line" d="M700 182H970V270"/>
