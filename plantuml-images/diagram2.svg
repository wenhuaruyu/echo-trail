  <rect class="s" x="470" y="270" width="260" height="70" fill="#edf0f4"/><text class="t" x="600" y="312" text-anchor="middle" font-size="20">银色点亮</text>
  <rect class="s" x="840" y="270" width="260" height="70" fill="#fff0a8"/><text class="t" x="970" y="312" text-anchor="middle" font-size="20">金色点亮</text>
  <path class="line" d="M230 340V410H600V440"/><path class="line" d="M600 340V440"/><path class="line" d="M970 340V410H600V440"/>
